<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Money Collection</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1c2330;--muted:#6b7385;--line:#e3e6ec;--accent:#e8590c;--ok:#2b8a3e;--okbg:#e6f4ea;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b1f27;--text:#e8eaf0;--muted:#98a0b3;--line:#2b303b;--accent:#ff8a4c;--ok:#69db7c;--okbg:#1d3326;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b1f27;--text:#e8eaf0;--muted:#98a0b3;--line:#2b303b;--accent:#ff8a4c;--ok:#69db7c;--okbg:#1d3326;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
input{flex:1;min-width:110px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600}
button.ghost{background:transparent;color:var(--bad);border:1px solid var(--line);padding:4px 10px;min-height:32px}
ul{list-style:none;margin:10px 0 0;padding:0}
.menu li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tag{background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px}
.sub{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;margin-top:8px}
.person{display:grid;grid-template-columns:28px 1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person .n{color:var(--muted);font-size:13px}
.person .name{font-weight:600;overflow-wrap:anywhere}
.person .amt{font-weight:700;white-space:nowrap}
.person .sel{grid-column:2/4;display:flex;gap:8px;align-items:center}
.person select{flex:1;min-width:0}
.paid{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.paid input{flex:none;min-width:0;width:18px;height:18px;min-height:0;accent-color:var(--ok)}
.person.done{background:var(--okbg);margin:0 -14px;padding:10px 14px}
.chips{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.chip button{background:transparent;color:var(--bad);padding:0 6px;min-height:24px;font-size:16px;line-height:1}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{background:var(--bg);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>🍽️ Food Money Collection</h1>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="sTotal">₹0</b><span>Total</span></div>
      <div class="stat"><b id="sPaid" style="color:var(--ok)">₹0</b><span>Collected</span></div>
      <div class="stat"><b id="sDue" style="color:var(--bad)">₹0</b><span>Pending</span></div>
    </div>
  </div>

  <div class="card">
    <h2>Food menu</h2>
    <div class="row">
      <input id="fName" placeholder="Food name" maxlength="60">
      <input id="fPrice" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Price ₹" style="max-width:120px">
      <button id="addFood">Add</button>
    </div>
    <label class="paid" style="margin-top:8px"><input type="checkbox" id="fSplit"> Split equally among everyone who picks it (e.g. Mandhi) — enter the <b>total bill</b> as price</label>
    <ul class="menu" id="menu"></ul>
  </div>

  <div class="card">
    <h2>People &amp; their food (<span id="count">0</span>)</h2>
    <input id="search" placeholder="Search name…" style="width:100%">
    <div class="row" style="margin-top:8px">
      <input id="pName" placeholder="Add a new person" maxlength="60">
      <button id="addPerson">Add</button>
    </div>
    <div id="people"></div>
    <div class="tools">
      <button id="copy">Copy pending list</button>
      <button id="reset">Clear all food &amp; paid</button>
    </div>
  </div>
</main>

<script>
(function(){
  var KEY = "foodMoneyV1";
  var NAMES = ["Gokul","Aardhra","Abhijith","Adhithya V Pillai","Rakendhu","Adithya Manoj","Agna","Akshara Vishnu","Akshaya Parameshwaran","Amruthendu","Anjana Hari","Anjana","Annmariaa","Anosh","Anusha","Aswin Joshy","Arunthathi","Arsh","Athira","Bettly","Bismitha","Devananda","Dhiya Ann","Diya Sathar","Drissya","Fabitha","Farheen","Fathima Fazleen","Fathima","Fiza","Goutham","Hasna","Lona","Janvy","Lakshmi","Greeshma","Lena","Meenakshi","Meera","Nahla","Namisha","Namitha","Nasmia","Nayana","Pravitha","Adithyan NJ","Ricky","Riya","Salma","Sayendhu","Shaun","Shibila","Sivani","Sreelakshmi","Thamannaahh","Yaswanth","Raychel","Nandana Sreenivasan","Mary","Akshaya A M","Ramzi","Abisha","Adhila","Adika","Amrita","Ajmila"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fresh(){ return {menu:[], people:NAMES.map(function(n){return {id:uid(), name:n, foods:[], paid:false};})}; }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && Array.isArray(s.menu) && Array.isArray(s.people)){
          // migrate old single-food data to a foods list
          s.people.forEach(function(p){
            if(!Array.isArray(p.foods)){ p.foods = p.food ? [p.food] : []; }
            delete p.food;
          });
          return s;
        }
      }
    }catch(e){}
    return fresh();
  }
  var state = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function money(n){ return "₹" + (Math.round(n*100)/100).toLocaleString("en-IN"); }
  function $(id){ return document.getElementById(id); }

  function foodById(id){
    for(var i=0;i<state.menu.length;i++) if(state.menu[i].id===id) return state.menu[i];
    return null;
  }
  // number of people sharing a food (a person counts once, even with duplicates)
  function eaters(id){ return state.people.filter(function(p){return p.foods.indexOf(id)!==-1;}).length; }
  // Cost of ONE entry of a food: full price, or total / number of people sharing a split item
  function priceOf(foodId){
    var f = foodById(foodId); if(!f) return 0;
    if(!f.split) return f.price;
    var n = eaters(foodId);
    return n ? f.price / n : 0;
  }
  function personTotal(p){
    return p.foods.reduce(function(sum,id){ return sum + priceOf(id); }, 0);
  }
  function findPerson(id){ return state.people.filter(function(p){return p.id===id;})[0]; }

  function renderMenu(){
    var ul = $("menu");
    if(!state.menu.length){ ul.innerHTML = '<li class="empty" style="border:0">No food added yet. Add items above.</li>'; return; }
    ul.innerHTML = state.menu.map(function(f){
      var info = f.split
        ? '<span class="tag">SPLIT</span><span class="sub">Total '+money(f.price)+' · '+eaters(f.id)+' sharing · '+money(priceOf(f.id))+' each</span>'
        : ' — <b>'+money(f.price)+'</b>';
      return '<li><span>'+esc(f.name)+info+'</span><button class="ghost" data-del="'+f.id+'">Delete</button></li>';
    }).join("");
  }

  function renderPeople(){
    var q = $("search").value.trim().toLowerCase();
    var opts = '<option value="">+ Add food…</option>' + state.menu.map(function(f){
      return '<option value="'+f.id+'">'+esc(f.name)+(f.split?' (split of '+money(f.price)+')':' ('+money(f.price)+')')+'</option>';
    }).join("");
    var html = "";
    state.people.forEach(function(p,i){
      if(q && p.name.toLowerCase().indexOf(q)===-1) return;
      var has = p.foods.length > 0;
      var chips = p.foods.map(function(id,idx){
        var f = foodById(id); if(!f) return "";
        return '<span class="chip">'+esc(f.name)+' · '+money(priceOf(id))+'<button title="Remove" data-rm="'+p.id+':'+idx+'">×</button></span>';
      }).join("");
      html += '<div class="person'+(p.paid?' done':'')+'">'
        + '<span class="n">'+(i+1)+'</span><span class="name">'+esc(p.name)+'</span>'
        + '<span class="amt">'+(has?money(personTotal(p)):"—")+'</span>'
        + (has ? '<div class="chips">'+chips+'</div>' : '')
        + '<div class="sel"><select data-food="'+p.id+'">'+opts+'</select>'
        + '<label class="paid"><input type="checkbox" data-paid="'+p.id+'"'+(p.paid?' checked':'')+(has?'':' disabled')+'> Paid</label></div>'
        + '</div>';
    });
    $("people").innerHTML = html || '<div class="empty">No matching names.</div>';
    $("count").textContent = state.people.length;
  }

  function renderStats(){
    var total=0, paid=0;
    state.people.forEach(function(p){
      var a = personTotal(p); total += a; if(p.paid) paid += a;
    });
    $("sTotal").textContent = money(total);
    $("sPaid").textContent = money(paid);
    $("sDue").textContent = money(total-paid);
  }
  function renderAll(){ renderMenu(); renderPeople(); renderStats(); }
  function refresh(){ save(); renderAll(); }

  $("addFood").addEventListener("click", function(){
    var name = $("fName").value.trim(), price = parseFloat($("fPrice").value);
    if(!name || !isFinite(price) || price < 0){ alert("Enter a food name and a valid price."); return; }
    state.menu.push({id:uid(), name:name, price:price, split:$("fSplit").checked});
    $("fName").value = ""; $("fPrice").value = ""; $("fSplit").checked = false; $("fPrice").placeholder = "Price ₹";
    refresh();
  });
  $("fSplit").addEventListener("change", function(){ $("fPrice").placeholder = this.checked ? "Total bill ₹" : "Price ₹"; });
  $("fPrice").addEventListener("keydown", function(e){ if(e.key==="Enter") $("addFood").click(); });

  $("menu").addEventListener("click", function(e){
    var id = e.target.getAttribute("data-del"); if(!id) return;
    if(!confirm("Delete this food? It will be removed from everyone who chose it.")) return;
    state.menu = state.menu.filter(function(f){return f.id!==id;});
    state.people.forEach(function(p){
      p.foods = p.foods.filter(function(x){return x!==id;});
      if(!p.foods.length) p.paid = false;
    });
    refresh();
  });

  $("people").addEventListener("change", function(e){
    var t = e.target, p, id;
    if((id = t.getAttribute("data-food")) !== null){
      p = findPerson(id); if(!p || !t.value) return;
      var f = foodById(t.value); if(!f) return;
      // a split item can only be shared once per person; normal items may repeat (e.g. 2 plates)
      if(!(f.split && p.foods.indexOf(f.id)!==-1)){ p.foods.push(f.id); p.paid = false; }
      refresh();
    } else if((id = t.getAttribute("data-paid")) !== null){
      p = findPerson(id); if(!p) return;
      p.paid = t.checked && p.foods.length > 0;
      refresh();
    }
  });

  $("people").addEventListener("click", function(e){
    var v = e.target.getAttribute("data-rm"); if(!v) return;
    var parts = v.split(":"), p = findPerson(parts[0]), idx = parseInt(parts[1],10);
    if(!p || !(idx >= 0 && idx < p.foods.length)) return;
    p.foods.splice(idx,1); p.paid = false;
    refresh();
  });

  $("search").addEventListener("input", renderPeople);

  $("addPerson").addEventListener("click", function(){
    var n = $("pName").value.trim(); if(!n) return;
    state.people.push({id:uid(), name:n, foods:[], paid:false});
    $("pName").value = ""; refresh();
  });
  $("pName").addEventListener("keydown", function(e){ if(e.key==="Enter") $("addPerson").click(); });

  $("reset").addEventListener("click", function(){
    if(!confirm("Clear every food selection and paid mark?")) return;
    state.people.forEach(function(p){ p.foods=[]; p.paid=false; });
    refresh();
  });

  $("copy").addEventListener("click", function(){
    var lines = [];
    state.people.forEach(function(p){
      if(p.foods.length && !p.paid){
        var names = p.foods.map(function(id){ var f=foodById(id); return f?f.name:""; }).filter(Boolean).join(", ");
        lines.push(p.name+" ("+names+") - "+money(personTotal(p)));
      }
    });
    var text = lines.length ? "Pending food money:\n"+lines.join("\n") : "Nothing pending.";
    function done(){ alert("Copied!"); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ prompt("Copy this:", text); });
    } else { prompt("Copy this:", text); }
  });

  renderAll();
})();
</script>
</body>
</html>
